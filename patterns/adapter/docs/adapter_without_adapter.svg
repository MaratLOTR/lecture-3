 link Switchable to ModernLight--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="42" data-link-type="extension"><path d="M219.2,335.527 C219.2,361.547 219.2,375.897 219.2,399.957" style="stroke:#000;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Switchable-backto-ModernLight" codeLine="42"/><polygon points="219.2,317.527,213.2,335.527,225.2,335.527,219.2,317.527" fill="none" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Client to LegacyLamp--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-source-line="45" data-link-type="dependency"><path d="M541.88,148.297 C541.88,170.197 541.88,190.697 541.88,212.907" style="stroke:#B3261E;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Client-to-LegacyLamp" codeLine="45"/><polygon points="541.88,217.907,545.88,208.907,541.88,212.907,537.88,208.907,541.88,217.907" fill="#B3261E" style="stroke:#B3261E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="358.88" y="178.815" fill="#B3261E" font-size="18" textLength="182.637" font-weight="700" font-family="Arial">× нет set_power()</text></g><!--link Switchable to LegacyLamp--><g class="legend" data-source-line="60"><rect x="190.994" y="613.683" width="527.72" height="42.594" fill="none" style="stroke:#000;stroke-width:1;"/><text x="195.994" y="631.678" fill="#000" font-size="14" textLength="517.72" font-family="Arial">Красная связь: попытка подключения, которая завершится ошибкой.</text><text x="195.994" y="647.975" fill="#000" font-size="14" textLength="489.884" font-family="Arial">Для работы с неизменным клиентом нужен перевод интерфейса.</text></g><?plantuml-src bLLVRnCv47_tfnZ1mpMY3L0aG54KgKL4dDJZ1TxQgd9sdSIgOqTUztBS7ua4991QY418I7Slzn5wLNCjRPC-t1Umlz6DlKdZa48XqcPtnp_Fp6zcVbugXEgq-2zSDeXHRJ0AQieOrOAKQvOOhYGXXXl1mBwp0ti4TjyUudNkUdRWdjlz4jXZEypVt4k4V79TjmjsQ0VWkdPa3-nvliUzTJr2icqksrJJ5jHeijtGQaUc3vHG6ZfDRbYqdZLfgZgO6TIfoEALi2bHMZ8Dj